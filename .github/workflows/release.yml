name: Publish release on npm
on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.x
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: corepack npm@12 install
      - run: corepack npm@12 run build
      - run: corepack npm@12 publish --provenance --access public --tag next
        if: "github.event.release.prerelease"
      - run: corepack npm@12 publish --provenance --access public
        if: "!github.event.release.prerelease"
